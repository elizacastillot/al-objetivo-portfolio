# Publica solo la carpeta site/ en GitHub Pages.
# Antes de publicar pasa las validaciones de marca y de sitio en modo estricto:
# si queda contenido de ejemplo o algo falla, no se publica.
name: Validar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Marca
        run: node scripts/check-brand.mjs
      - name: Sitio (estricto)
        run: node scripts/check-site.mjs --strict

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
